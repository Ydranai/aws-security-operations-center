Outputs:
  CustomWidgetSectionHeaderFunctionName:
    Description: Lambda function used by AWS service section header custom widgets.
    Value: !Ref CustomWidgetSectionHeaderFunction

  CustomWidgetHeaderFunctionName:
    Description: Lambda function used by the CloudWatch custom header widget.
    Value: !Ref CustomWidgetHeaderFunction

  CustomWidgetHeaderFunctionArn:
    Description: ARN of the Lambda function used by the CloudWatch custom header widget.
    Value: !GetAtt CustomWidgetHeaderFunction.Arn

  DashboardName:
    Description: CloudWatch dashboard name.
    Value: !Ref DashboardName

  DashboardUrl:
    Description: CloudWatch dashboard console URL.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${DashboardName}

  LambdaFunctionName:
    Description: Metrics collector Lambda.
    Value: !Ref SecurityMetricsLambda

  LambdaRoleArn:
    Description: Least-privilege Lambda role.
    Value: !GetAtt SecurityMetricsLambdaRole.Arn

  NotificationTopic:
    Description: Existing SNS topic used by this stack.
    Value: !Ref AlertTopicArn

  MetricNamespaceOutput:
    Description: Custom CloudWatch namespace.
    Value: !Ref MetricNamespace

  ActiveFindingsInsightArn:
    Description: Security Hub Insight used for active finding severity counts.
    Value: !Ref ActiveFindingsBySeverityInsight

  GuardDutyInsightArn:
    Description: Security Hub Insight used for GuardDuty severity counts.
    Value: !Ref GuardDutyBySeverityInsight

  FailedControlsInsightArn:
    Description: Security Hub Insight used for failed controls.
    Value: !Ref FailedControlsBySeverityInsight

  OperationalFindingsSchedule:
    Description: EventBridge rule that refreshes operational finding details.
    Value: !Ref FindingsDetailScheduleRule

  OperationalFindingsLogGroupName:
    Description: Dedicated log group queried by finding-detail dashboard tables.
    Value: !Ref OperationalFindingsLogGroup

  IamOperationsLogGroupName:
    Description: Dedicated log group queried by IAM detail dashboard tables.
    Value: !Ref IamOperationsLogGroup



  CriticalFindingsAlarmName:
    Description: CloudWatch alarm for active CRITICAL Security Hub findings.
    Value: !Ref CriticalFindingsAlarm

  GuardDutyCriticalAlarmName:
    Description: CloudWatch alarm for CRITICAL GuardDuty findings.
    Value: !Ref GuardDutyCriticalFindingsAlarm

  CollectorErrorsAlarmName:
    Description: CloudWatch alarm for collector Lambda errors.
    Value: !Ref SecurityCollectorLambdaErrorsAlarm
